<!DOCTYPE html>
<html>
<head>
	<!-- Meta -->
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<meta http-equiv="Expires" content="-1">
	<!-- End of Meta -->

	<!-- Page title -->
	<title>NC220 Admin - Login</title>
	<!-- End of Page title -->

	<!-- Libraries -->
	<link type="text/css" href="css/login.css" rel="stylesheet" />
	<link type="text/css" href="css/plug.css" rel="stylesheet" />
<link href="favicon.ico" rel="icon" />
<link href="favicon.png" rel="shortcut icon png" />
	<!-- End of Libraries -->
</head>
<body>
	<div id="wrapper">
		<div id="header">
		<!-- Top -->
		<div id="top">
			<div id="logo" class="tooltip lang_title" title="">
				<a target="_blank" href="http://www.tp-link.com"></a>
				<span style="display:none">TP-LINK</span>
			</div>
		</div>

	</div>
	<div id="mid">
		<div id="block"></div>
		<div id="main">
	<div id="container">
		
		
		<div class="contain">
			<div id="box">
				<div class="login-contain-row">
					
					<span class="login-contain-cell-contain login-contain-cell login-contain-cell-username">
						<span id="login-usr-img" class="login-usr-img login-contain-cell-img"></span>
						<span class="login-contain-border-img"></span>
						<input class="login-input" maxlength="20" tabindex="1" id="username" name="Username"  />
					</span>
				</div>
				<div class="login-contain-row">
					
					<span class="login-contain-cell-contain login-contain-cell login-contain-cell-password">
						<span id="login-pwd-img" class="login-pwd-img login-contain-cell-img"></span>
						<span class="login-contain-border-img"></span>
						<input AUTOCOMPLETE="off" tabindex="2" class="login-input" id="password" type="password" name="Password"/>
					</span>
				</div>
					<span class="space remeberpwdcontain">
						<span class="setting-single-checkbox">
						<input id="rememberpwd" type="checkbox" />
					</span>
						<span id="rememberpwd-title"><span class="lang"></span><!--Remember account--></span>
						
					</span>	
				<input id="login" class="lang_button" type="button" value="" tabindex="4"/>
		</div>
	</div>
</div>
</div>
</div>
	<div id="foot">
		<div id="companyinfo">
			<span id="companyinfo-inner">
				<span class="lang"></span><!--Copyright © 2014 TP-LINK Technologies Co.,Ltd. All rights reserved.-->
			</span>
		</div>
	</div>
</div>
</body>
	<script type="text/javascript" src="lib/jqueryX.js"></script>
	<script type="text/javascript" src="i18n/en.js?v=1.1.0"></script>
	<script type="text/javascript" src="js/login.js?v=1.1.0"></script>
	<script type="text/javascript" src="js/plug.js?v=1.1.0"></script>
</html>
