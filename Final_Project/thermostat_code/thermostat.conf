# Configuration file for the thermostat daemon

# Base URL of the data server. "/data" is appended automatically to
# form the endpoint tcsimd polls and posts to.
API_BASE=http://ec2-18-220-131-54.us-east-2.compute.amazonaws.com:8080

# Where tcsimd reads the current temperature reading from.
TEMP_FILE_PATH=/tmp/temp

# Where tcsimd writes the heater ON/OFF status to.
STATUS_FILE_PATH=/tmp/status

# Document IDs on the data server that the status and temperature
# updates get posted to.
STATUS_ID=6a6570674d6b1510bc5c6dad
TEMPERATURE_ID=6a6570674d6b1510bc5c6dae

# How often (in seconds) the control loop polls the schedule, reads
# the temperature, and reports status back to the server.
POLL_INTERVAL_SECONDS=10

# Display name used in log/status output (e.g. "tcsimd is running").
# Purely cosmetic — doesn't affect how the running daemon is found.
DAEMON_NAME=thermostat

# How long "stop" waits (in milliseconds) for the daemon to shut
# down cleanly after SIGTERM before escalating to SIGKILL.
STOP_TIMEOUT_MS=5000

# How often (in milliseconds) "stop" re-checks whether the daemon
# has exited yet while waiting out STOP_TIMEOUT_MS.
STOP_POLL_MS=100
